global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "domain"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: "critical"
      repeat_interval: 30m

receivers:
  - name: "default"
    # Wire up a real receiver for your own use, e.g.:
    # webhook_configs:
    #   - url: "http://homeassistant.local:8123/api/webhook/battery-alerts"
    # email_configs:
    #   - to: "you@example.com"

  - name: "critical"
    # Same idea, e.g. a Pushover/Telegram/SMS webhook for anything
    # that should wake you up (like BatteryPackVoltageCritical).
