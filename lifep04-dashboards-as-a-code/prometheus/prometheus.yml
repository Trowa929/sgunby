global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Raspberry Pi -> BLE -> LiFePO4 BMS exporter (simulated in this repo,
  # see exporters/ble_battery_exporter for the real-hardware version)
  - job_name: "ble_battery_exporter"
    static_configs:
      - targets: ["ble-battery-exporter:9101"]
        labels:
          device: "pi-battery-monitor-01"
          location: "haliburton-shed"

  # --- Examples for adapting this repo to your own environment ---
